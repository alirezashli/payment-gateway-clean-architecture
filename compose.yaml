services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: payment-gateway-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-web:
    build:
      context: .
      dockerfile: src/Payment.Web/Dockerfile
    container_name: payment-web
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway-web:
    build:
      context: .
      dockerfile: src/Gateway.Web/Dockerfile
    container_name: gateway-web
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      PaymentService__BaseUrl: http://payment-web:8080/
    depends_on:
      - payment-web

  payment-worker:
    build:
      context: .
      dockerfile: src/Payment.Worker/Dockerfile
    container_name: payment-worker
    restart: unless-stopped
    environment:
      PaymentService__BaseUrl: http://payment-web:8080/
    depends_on:
      - payment-web

  notification-worker:
    build:
      context: .
      dockerfile: src/Notification.Worker/Dockerfile
    container_name: notification-worker
    restart: unless-stopped
    environment:
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
